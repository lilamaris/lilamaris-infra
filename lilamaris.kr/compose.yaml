services:
  caddy:
    image: caddy:2.11.3-alpine
    restart: unless-stopped
    container_name: lilamaris-kr-caddy
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
      - 2019:2019
    volumes:
      - ./conf/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:2019/metrics"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - default
      - observer

  anubis:
    image: ghcr.io/techarohq/anubis:latest
    restart: unless-stopped
    container_name: lilamaris-kr-anubis
    pull_policy: always
    environment:
      BIND: ":8923"
      METRICS_BIND: ":9090"
      TARGET: "http://blog:80"
      DIFFICULTY: "4"
      SERVE_ROBOTS_TXT: "true"
      OG_PASSTHROUGH: "true"
      OG_EXPIRY_TIME: "24h"
    expose:
      - 8923
      - 9090
    healthcheck:
      test: ["CMD", "anubis", "--healthcheck"]
      interval: 5s
      timeout: 30s
      retries: 5
      start_period: 500ms
    volumes:
      - "./conf/anubis/botPolicy.yaml:/data/cfg/botPolicy.yaml:ro"
    depends_on:
      - blog 

  blog:
    image: ${BLOG_IMAGE_NAME}:${BLOG_IMAGE_TAG}
    restart: unless-stopped
    container_name: lilamaris-kr-blog
    expose:
      - 80

volumes:
  caddy-data:
  caddy-config:

networks:
  default:
    name: lilamaris-kr-network
    external: true

  observer:
    name: internal-observability-network
    external: true
