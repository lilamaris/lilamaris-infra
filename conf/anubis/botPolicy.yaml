bots:
  - name: robots-txt
    path_regex: ^/robots.txt$
    action: ALLOW

  - name: sitemap
    path_regex: ^/sitemap.*\.xml$
    action: ALLOW

  - name: favicon
    path_regex: ^/favicon.ico$
    action: ALLOW
  
  - name: rss
    path_regex: ^/(rss|feed|atom)\.xml$
    action: ALLOW

  - name: well-known
    path_regex: ^/.well-known/.*
    action: ALLOW
