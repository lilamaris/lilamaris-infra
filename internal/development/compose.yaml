x-app-healthcheck-defaults: &dev-healthcheck-defaults
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 30s

services:
  postgres:
    image: postgres:${POSTGRES_IMAGE_TAG:-18-alpine}
    restart: unless-stopped
    container_name: internal-development-postgres
    cpus: 2.0
    mem_limit: 2g
    environment:

      POSTGRES_DB: ${POSTGRES_DB:-dev}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD must be provided}

      POSTGRES_EXPORTER_USERNAME: ${POSTGRES_EXPORTER_USERNAME:-postgres-exporter}
      POSTGRES_EXPORTER_PASSWORD: ${POSTGRES_EXPORTER_PASSWORD:-postgres-exporter}

    ports:
      - 127.0.0.1:26000:5432
    volumes:
      - postgres-data:/var/lib/postgres
      - ./conf/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      <<: *dev-healthcheck-defaults
      test: 
        - CMD-SHELL
        - pg_isready -U $${PG_USER} -d $${PG_DB}

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:${POSTGRES_EXPORTER_IMAGE_TAG:-latest}
    restart: unless-stopped
    container_name: internal-development-postgres-exporter
    cpus: 0.5
    mem_limit: 1g
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      
      DATA_SOURCE_URI: postgres:5432/${POSTGRES_DB:-dev}?sslmode=disable
      DATA_SOURCE_USER: ${POSTGRES_EXPORTER_USERNAME:-postgres-exporter}
      DATA_SOURCE_PASS: ${POSTGRES_EXPORTER_PASS:-postgres-exporter}

    ports:
      - 127.0.0.1:26001:9187
    networks:
      - default
      - observer

  kafka:
    image: confluentinc/cp-kafka:${KAFKA_IMAGE_TAG:-latest}
    restart: unless-stopped
    container_name: internal-development-kafka
    cpus: 1.0
    mem_limit: 1g
    environment:

      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:29092,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://${KAFKA_EXTERNAL_HOST}:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT

      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_PROTOCOL_VERSION: 3.8
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: true

      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: kafka
      KAFKA_JMX_OPTS: -Dcom.sun.management.jmxremote -Dcom.sun.management.jmxremote.authenticate=false, -Dcom.sun.management.jmxremote.ssl=false, -Djava.rmi.server.hostname=kafka-broker

    ports:
      - 127.0.0.1:26010:9092
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      <<: *dev-healthcheck-defaults
      test: 
        - CMD-SHELL
        - kafka-topics --bootstrap-server localhost:29092 --list >/dev/null 2>&1

  kafka-exporter:
    image: danielqsj/kafka-exporter:${KAFKA_EXPORTER_IMAGE_TAG:-v1.8.0}
    restart: unless-stopped
    container_name: internal-development-kafka-exporter
    depends_on:
      kafka:
        condition: service_healthy
    cpus: 0.5
    mem_limit: 1g
    command:
      - --kafka.server=kafka:29092
    ports:
      - 127.0.0.1:26011:9308
    networks:
      - default
      - observer

  kafka-jmx-exporter:
    image: bitnami/jmx-exporter:${KAFKA_JMX_EXPORTER_IMAGE_TAG:-latest}
    restart: unless-stopped
    container_name: internal-development-kafka-jmx-exporter
    depends_on:
      kafka:
        condition: service_healthy
    cpus: 0.5
    mem_limit: 1g
    environment:

      JVM_OPTS: -Xms256m -Xmx512m -XX:+UseG1GC

    command:
      - "9404"
      - /opt/bitnami/jmx-exporter/config/kafka.yml
    volumes:
      - ./conf/kafka-jmx-exporter/kafka.yml:/opt/bitnami/jmx-exporter/config/kafka.yml:ro
    ports:
      - 127.0.0.1:26012:9404
    networks:
      - default
      - observer

volumes:
  postgres-data:
  kafka-data:

networks:
  default:
    name: internal-development-network
    external: true
  observer:
    name: internal-observability-network
    external: true
