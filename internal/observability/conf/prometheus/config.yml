global:
  scrape_interval: 10s
  scrape_timeout: 5s

scrape_configs:
  - job_name: "node"
    static_configs:
      - targets:
        - "host.docker.internal:25910"

  - job_name: "postgres"
    static_configs:
      - targets:
        - "postgres-exporter:9187"
        labels:
          hostname: "deneb"
          exporter: "postgres-exporter"

  - job_name: "kafka"
    static_configs:
      - targets:
        - "kafka-exporter:9308"
        labels:
          hostname: "deneb"
          exporter: "kafka-exporter"
